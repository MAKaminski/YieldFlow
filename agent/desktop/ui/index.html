<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YieldFlow Agent</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b1220;
        color: #e6edf7;
        display: grid;
        place-items: center;
        height: 100vh;
      }
      .card { max-width: 420px; padding: 24px; text-align: center; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: #8497b8; font-size: 13px; line-height: 1.5; }
      .dot { color: #3ddc97; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>YieldFlow <span class="dot">Agent</span></h1>
      <p>
        This app opens a bank application in your own browser and pre-fills what it can.
        You complete identity verification and submit. Trigger it from the
        <b>Launch agent</b> button on a campaign in the YieldFlow web app.
      </p>
      <p>Your identity data stays on this machine and is never sent to YieldFlow.</p>
    </div>
  </body>
</html>
