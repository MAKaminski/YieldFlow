<!doctype html>
<!--
  The application form is embedded in an <iframe> (a real pattern for banks and
  KYC vendors). The agent must reach INTO the frame to prefill and to detect the
  identity step. The parent page itself has no form fields.
-->
<html>
<head><meta charset="utf-8"><title>Open your account — Demo Bank</title></head>
<body>
  <h1>Open your account</h1>
  <iframe id="app" src="iframe-inner.html" width="500" height="400" title="Application"></iframe>
</body>
</html>
