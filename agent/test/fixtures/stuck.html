<!doctype html>
<!--
  A wizard step whose CONTINUE never advances (it silently requires something the
  agent can't provide). The agent must detect "no progress" and hand over after a
  single ineffective click — NOT loop CONTINUE until MAX. window.__continueClicks
  counts how many times CONTINUE was actually clicked.
-->
<html>
<head><meta charset="utf-8"><title>Stuck wizard</title>
<style>.modal{position:fixed;inset:20%}</style></head>
<body>
  <script>window.__events=[]; window.__continueClicks=0;</script>
  <div class="modal" role="dialog" aria-modal="true">
    <p>Almost there</p>
    <button onclick="window.__continueClicks++; window.__events.push('continue-noop')">CONTINUE</button>
  </div>
</body>
</html>
