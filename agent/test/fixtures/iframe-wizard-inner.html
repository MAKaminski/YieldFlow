<!doctype html>
<!--
  A TWO-STEP SPA wizard that lives entirely inside an <iframe> (see
  iframe-wizard.html). Step A is a personal-info form with a CONTINUE button;
  clicking it swaps to Step B, the identity step. Exercises the agent clicking a
  CTA *inside a frame* and then stopping at the in-frame identity step.
-->
<html>
<head><meta charset="utf-8"><title>Application</title>
<style>.hidden{display:none}</style></head>
<body>
  <script>window.__innerEvents = [];</script>

  <div id="stepA">
    <label for="fn">First name</label><input id="fn"><br>
    <label for="ci">City</label><input id="ci"><br>
    <label for="zp">ZIP</label><input id="zp"><br>
    <button id="cont" onclick="toB()">CONTINUE</button>
  </div>

  <div id="stepB" class="hidden">
    <label for="dob">Date of birth</label><input id="dob" placeholder="MM/DD/YYYY"><br>
    <label for="ssn">Social Security Number</label><input id="ssn" type="password"><br>
    <button onclick="window.__innerEvents.push('identity:submit')">SUBMIT APPLICATION</button>
  </div>

  <script>
    function toB(){
      window.__innerEvents.push('continue');
      document.getElementById('stepA').classList.add('hidden');
      document.getElementById('stepB').classList.remove('hidden');
    }
  </script>
</body>
</html>
